<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweet Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: one candy-colored card, a timer bar on top, answers as chunky buttons */
  :root {
    --bg: #fdf1ec;
    --card: #fffaf6;
    --ink: #33262b;
    --soft: #85696f;
    --pink: #ef8fa0;
    --pink-deep: #cc5a6c;
    --mint: #9fdcc4;
    --lemon: #f6d36b;
    --lilac: #cbb7ea;
    --line: #f1dcd5;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    padding-inline: 16px;
    padding-block: 24px;
    display: grid;
    place-items: center;
    background-image:
      radial-gradient(circle at 10% 15%, #f8d3db 0 70px, transparent 71px),
      radial-gradient(circle at 90% 85%, #dcf1e7 0 90px, transparent 91px),
      radial-gradient(circle at 85% 12%, #fbeab8 0 40px, transparent 41px);
  }
  .card {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 28px;
    box-shadow: 7px 7px 0 var(--ink);
    padding: 24px 22px;
    display: grid; gap: 16px;
  }
  .hud { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-weight: 600; }
  .pill { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
  .timer { height: 12px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: #fff; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--mint); transform-origin: left; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1.1; margin: 0; text-align: center; text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.3; margin: 0; text-align: center; text-wrap: balance; }
  p { margin: 0; line-height: 1.5; }
  .sub { color: var(--soft); text-align: center; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .answers { grid-template-columns: 1fr; } }
  button, .btn {
    font: inherit; font-weight: 700;
    border: 2.5px solid var(--ink); border-radius: 16px;
    padding: 14px 12px; cursor: pointer; color: var(--ink);
    background: #fff; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s, background .2s;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
  .answers button:nth-child(1) { background: #fde3e8; }
  .answers button:nth-child(2) { background: #e3f5ec; }
  .answers button:nth-child(3) { background: #fdf2d2; }
  .answers button:nth-child(4) { background: #ece4f8; }
  .answers button.right { background: var(--mint) !important; }
  .answers button.wrong { background: var(--pink) !important; color: #fff; }
  .answers button:disabled { cursor: default; }
  .primary { background: var(--pink); color: #fff; width: 100%; }
  .feedback { text-align: center; font-family: var(--display); font-weight: 600; min-height: 1.5em; }
  .big { font-family: var(--display); font-weight: 700; font-size: 3.4rem; text-align: center; color: var(--pink-deep); font-variant-numeric: tabular-nums; line-height: 1; }
  .badge { justify-self: center; background: var(--lemon); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-weight: 600; }
  form { display: grid; gap: 10px; }
  label { font-weight: 700; font-size: .95rem; }
  input {
    width: 100%; font: inherit; padding: 13px 14px;
    border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink);
  }
  .err { color: var(--pink-deep); font-size: .9rem; min-height: 1.2em; text-align: center; }
  .note { font-size: .78rem; color: var(--soft); text-align: center; }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.94); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } button { transition: none; } }
</style>
</head>
<body>
<main class="card" id="app" aria-live="polite"></main>

<script>
const QUESTIONS = [
  { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Saturn"], c: 1 },
  { q: "How many hearts does an octopus have?", a: ["1", "2", "3", "4"], c: 2 },
  { q: "Which fruit wears its seeds on the outside?", a: ["Kiwi", "Banana", "Strawberry", "Mango"], c: 2 },
  { q: "Which flower is famous in the Netherlands?", a: ["Tulip", "Rose", "Lotus", "Daisy"], c: 0 },
  { q: "What color is a polar bear's skin?", a: ["White", "Pink", "Black", "Grey"], c: 2 },
  { q: "Which is the largest ocean on Earth?", a: ["Atlantic", "Indian", "Arctic", "Pacific"], c: 3 },
  { q: "Which country gave the Statue of Liberty to the USA?", a: ["France", "UK", "Italy", "Spain"], c: 0 },
  { q: "How many colors are in a rainbow?", a: ["5", "6", "7", "8"], c: 2 },
  { q: "Which animal can sleep standing up?", a: ["Cat", "Horse", "Rabbit", "Dog"], c: 1 },
  { q: "Honey can stay good for thousands of years. True or false?", a: ["True", "False"], c: 0 }
];
const TIME = 10;          // seconds per question
const BASE = 100;         // points for a right answer
const SPEED = 10;         // bonus per second left
const STREAK = 25;        // bonus per answer in a streak

let idx = 0, score = 0, streak = 0, correct = 0, timer = null, left = TIME;
const app = document.getElementById("app");

function title(s) {
  if (s >= 1700) return "Trivia Queen 👑";
  if (s >= 1200) return "Big Brain Energy 🧠";
  if (s >= 700) return "Pretty Smart Cookie 🍪";
  return "Cute but Clueless 🐣";
}

function start() {
  app.innerHTML = `
    <div class="pop" style="display:grid;gap:14px">
      <h1>Sweet Trivia 🍬</h1>
      <p class="sub">10 quick questions. 10 seconds each. Answer fast for bonus points and keep your streak alive.</p>
      <button class="primary" id="go">Play</button>
    </div>`;
  document.getElementById("go").onclick = () => { idx = 0; score = 0; streak = 0; correct = 0; ask(); };
}

function ask() {
  const Q = QUESTIONS[idx];
  left = TIME;
  app.innerHTML = `
    <div class="hud"><span class="pill">${idx + 1} / ${QUESTIONS.length}</span><span class="pill" id="score">${score} pts</span></div>
    <div class="timer"><i id="bar"></i></div>
    <h2 class="pop">${Q.q}</h2>
    <div class="answers">${Q.a.map((t, k) => `<button data-k="${k}">${t}</button>`).join("")}</div>
    <p class="feedback" id="fb">${streak >= 2 ? "🔥 Streak x" + streak : ""}</p>`;
  app.querySelectorAll(".answers button").forEach(b => b.onclick = () => pick(+b.dataset.k));
  const bar = document.getElementById("bar");
  const t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const el = (performance.now() - t0) / 1000;
    left = Math.max(0, TIME - el);
    bar.style.transform = `scaleX(${left / TIME})`;
    bar.style.background = left < 3 ? "var(--pink)" : left < 6 ? "var(--lemon)" : "var(--mint)";
    if (left <= 0) pick(-1);
  }, 50);
}

function pick(k) {
  clearInterval(timer);
  const Q = QUESTIONS[idx];
  const btns = app.querySelectorAll(".answers button");
  btns.forEach(b => b.disabled = true);
  btns[Q.c].classList.add("right");
  const fb = document.getElementById("fb");
  if (k === Q.c) {
    streak++; correct++;
    const pts = BASE + Math.round(left) * SPEED + (streak > 1 ? (streak - 1) * STREAK : 0);
    score += pts;
    fb.textContent = `+${pts} ${streak > 1 ? "🔥 x" + streak : "✨"}`;
  } else {
    streak = 0;
    if (k >= 0) btns[k].classList.add("wrong");
    fb.textContent = k < 0 ? "Time's up ⏰" : "Oops! 🙈";
  }
  document.getElementById("score").textContent = score + " pts";
  setTimeout(() => { idx++; idx < QUESTIONS.length ? ask() : finish(); }, 1100);
}

function finish() {
  app.innerHTML = `
    <div class="pop" style="display:grid;gap:14px">
      <p class="sub">Your final score</p>
      <div class="big">${score}</div>
      <span class="badge">${title(score)}</span>
      <p class="sub">${correct} of ${QUESTIONS.length} right</p>
      <button class="primary" id="again">Play again</button>
    </div>`;
  document.getElementById("again").onclick = start;
}

start();
</script>
</body>
</html>
